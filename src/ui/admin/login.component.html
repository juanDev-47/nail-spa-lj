<main class="grid min-h-dvh place-items-center bg-[#fffaf7] p-5"><section class="w-full max-w-md border border-[#dfcfca] bg-white p-6 sm:p-9"><a routerLink="/reservar" class="font-display text-xl text-[#4a2632]">LJ Nail Spa</a><p class="mt-8 text-xs font-bold uppercase tracking-[0.16em] text-[#b64058]">Administracion</p><h1 class="mt-2 font-display text-4xl text-[#352427]">Inicia sesion</h1>@if (errorMessage) { <p class="mt-5 border-l-4 border-[#b64058] bg-[#fff0ee] px-3 py-2 text-sm text-[#782e3d]">{{ errorMessage }}</p> }<form class="mt-7 space-y-5" [formGroup]="form" (ngSubmit)="submit()"><label class="block text-sm font-bold">Correo<input class="mt-2 block w-full border border-[#dfcfca] px-3 py-3 font-normal" formControlName="correo" type="email" autocomplete="email"></label><label class="block text-sm font-bold">Contrasena<input class="mt-2 block w-full border border-[#dfcfca] px-3 py-3 font-normal" formControlName="password" type="password" autocomplete="current-password"></label><button class="w-full bg-[#4a2632] px-5 py-3 text-sm font-bold text-white disabled:bg-[#cbbcb7]" [disabled]="submitting" type="submit">{{ submitting ? 'Verificando...' : 'Entrar al panel' }}</button></form></section></main>
