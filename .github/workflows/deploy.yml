name: Deploy front

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-front

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STACK_NAME: nails-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy infraestructura (S3 + CloudFront)
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/template.yaml \
            --no-fail-on-empty-changeset

      - name: Build
        run: |
          npm ci
          npm run build
        env:
          API_URL: ${{ vars.API_URL }}

      - name: Publicar en S3 e invalidar CloudFront
        run: |
          out() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          BUCKET=$(out BucketName)
          DIST=$(out DistributionId)
          # Assets con hash: caché larga; index.html: siempre revalidado
          aws s3 sync dist/nails/browser "s3://$BUCKET" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/nails/browser/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html"
